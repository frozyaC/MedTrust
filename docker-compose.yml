name: medtrust

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: medtrust
      POSTGRES_USER: medtrust
      POSTGRES_PASSWORD: medtrust
    ports:
      - "5433:5432"
    volumes:
      - medtrust_pgdata:/var/lib/postgresql/data

  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./searxng:/etc/searxng:rw

volumes:
  medtrust_pgdata:
